<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumio Studio</title>
<meta name="description" content="Enhance photos and video for free. Sign in to unlock every VIP tool at no cost.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%239d8cff'/%3E%3Cpath d='M16 6v20M6 16h20' stroke='%2315121d' stroke-width='3'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#15121d; --panel:#1d1929; --panel2:#262136; --edge:#3a3350; --text:#f1edf8; --muted:#a9a1bd;
  --violet:#9d8cff; --violet-d:#6f5cf0; --amber:#ffc15a; --mint:#6fe0c5; --danger:#ff8a98;
  --r-s:6px; --r-m:12px; --r-l:20px;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-ui:"Figtree","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--text);font:15px/1.5 var(--f-ui)}
body{min-height:100vh}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;line-height:1.1}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--violet)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{display:flex;align-items:center;gap:20px;padding:10px 20px;border-bottom:1px solid var(--edge);background:var(--ink);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font:700 22px var(--f-display);color:var(--text);text-decoration:none}
.brand svg{width:28px;height:28px}
.nav{display:flex;gap:4px;flex:1;overflow-x:auto}
.nav a{color:var(--muted);text-decoration:none;padding:7px 12px;border-radius:99px;white-space:nowrap}
.nav a:hover{color:var(--text)}
.nav a[aria-current=page]{background:var(--panel2);color:var(--text)}
.authbox{display:flex;align-items:center;gap:10px}
.mode-note{font-size:12px;color:var(--muted);border:1px dashed var(--edge);padding:3px 8px;border-radius:99px}

/* buttons */
.btn{border:1px solid var(--edge);background:var(--panel2);padding:8px 14px;border-radius:99px;display:inline-flex;align-items:center;gap:8px;line-height:1.2;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--violet)}
.btn.primary{background:var(--violet);border-color:var(--violet);color:#14102b;font-weight:600}
.btn.primary:hover{background:#b3a6ff}
.btn.vip{background:linear-gradient(135deg,#ffd37f,#ffb03a);border-color:#ffb03a;color:#2b1c00;font-weight:600}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.icon{padding:8px;border-radius:var(--r-s)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg,.rail svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;line-height:1.5}
.badge.vip{background:var(--amber);color:#2b1c00}
.badge.free{background:rgba(111,224,197,.16);color:var(--mint)}
.badge.soon{background:var(--panel2);color:var(--muted);border:1px solid var(--edge)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--violet-d);display:grid;place-items:center;font-weight:700}

/* views */
.view{padding:0}
.page{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
.page h2{font-size:30px;margin-bottom:6px}
.page .lede{color:var(--muted);max-width:60ch;margin-bottom:22px}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:36px;align-items:center;padding:44px 20px 28px;max-width:1180px;margin:0 auto}
.hero h1{font-size:clamp(34px,5vw,58px);font-weight:700;font-variation-settings:"wdth" 90}
.hero p{color:var(--muted);margin:16px 0 24px;max-width:46ch;font-size:17px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap}
.hero .fine{margin:14px 0 0;font-size:13px}
.cmp{position:relative;border-radius:var(--r-l);overflow:hidden;border:1px solid var(--edge);background:#000;aspect-ratio:8/5;touch-action:none;user-select:none}
.cmp canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cmp .after{clip-path:inset(0 0 0 50%)}
.cmp .handle{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.cmp .handle::after{content:"";position:absolute;top:50%;left:50%;width:34px;height:34px;margin:-17px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.5)}
.cmp .tag{position:absolute;bottom:10px;padding:2px 9px;border-radius:99px;font-size:12px;background:rgba(10,8,18,.7)}
.cmp .tag.l{left:10px}.cmp .tag.r{right:10px}
.cmp input[type=range]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.section{max-width:1180px;margin:0 auto;padding:22px 20px}
.section h2{font-size:24px;margin-bottom:4px}
.section .sub{color:var(--muted);margin-bottom:16px}
.quick{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.qtile{flex:0 0 150px;background:var(--panel);border:1px solid var(--edge);border-radius:var(--r-m);padding:0;overflow:hidden;text-align:left;position:relative}
.qtile canvas{display:block;width:100%;height:96px}
.qtile span{display:block;padding:8px 10px;font-weight:600;font-size:14px}
.qtile:hover{border-color:var(--violet)}
.qtile .badge{position:absolute;top:6px;right:6px}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tool{display:flex;gap:14px;align-items:flex-start;background:var(--panel);border:1px solid var(--edge);border-radius:var(--r-m);padding:16px;text-align:left}
.tool:hover{border-color:var(--violet)}
.tool .ic{flex:0 0 40px;height:40px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;color:var(--violet)}
.tool .ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool b{display:block;font-family:var(--f-display);font-size:17px}
.tool small{color:var(--muted);display:block;margin-top:2px}
.tool.big{grid-column:span 1}

/* editor shell */
.ed{display:grid;grid-template-columns:76px minmax(0,1fr) 330px;height:calc(100vh - 53px);min-height:520px}
.rail{background:var(--panel);border-right:1px solid var(--edge);display:flex;flex-direction:column;padding:8px 6px;gap:2px;overflow-y:auto}
.rail button{background:none;border:0;border-radius:10px;padding:9px 2px 7px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;position:relative}
.rail button:hover{color:var(--text)}
.rail button[aria-pressed=true]{background:var(--panel2);color:var(--violet)}
.rail .lockdot{position:absolute;top:4px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--amber)}
.stage{display:flex;flex-direction:column;min-width:0;background:#0f0d16}
.stagebar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--edge);background:var(--ink);flex-wrap:wrap}
.stagebar .fname{flex:1;min-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.canvaswrap{flex:1;min-height:0;display:grid;place-items:center;padding:16px;position:relative;overflow:hidden}
.canvaswrap.checker .frame{background:conic-gradient(#2b2638 25%,#1d1929 0 50%,#2b2638 0 75%,#1d1929 0) 0 0/20px 20px}
.frame{position:relative;max-width:100%;max-height:100%;line-height:0;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.frame canvas{display:block;max-width:100%;max-height:calc(100vh - 190px)}
.frame canvas.over{position:absolute;inset:0;width:100%;height:100%}
.frame .divider{position:absolute;top:0;bottom:0;width:2px;background:#fff;cursor:ew-resize;left:50%}
.frame .divider::after{content:"";position:absolute;top:50%;left:50%;width:28px;height:28px;margin:-14px;border-radius:50%;background:#fff}
.stagefoot{padding:6px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--edge);display:flex;gap:14px;flex-wrap:wrap}
.insp{background:var(--panel);border-left:1px solid var(--edge);overflow-y:auto;padding:16px}
.insp h3{font-size:19px;margin-bottom:4px}
.insp .hint{color:var(--muted);font-size:13px;margin-bottom:14px}
.insp .group{margin-top:16px}
.insp .group>h4{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600}
.dropzone{border:2px dashed var(--edge);border-radius:var(--r-l);padding:40px 24px;text-align:center;max-width:460px;color:var(--muted)}
.dropzone.drag{border-color:var(--violet);color:var(--text)}
.dropzone h3{color:var(--text);font-size:24px;margin-bottom:8px}
.dropzone .btn{margin-top:16px}

/* sliders */
.sl{margin:0 0 12px}
.sl .row{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;gap:6px}
.sl .row label{display:flex;align-items:center;gap:6px}
.sl output{color:var(--muted);font-variant-numeric:tabular-nums;min-width:30px;text-align:right}
.sl input[type=range]{width:100%;accent-color:var(--violet);margin:4px 0 0}
.sl.locked{opacity:.6}

/* chips and grids */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--edge);background:var(--panel2);border-radius:99px;padding:5px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--violet)}
.chip[aria-pressed=true]{background:var(--violet);border-color:var(--violet);color:#14102b;font-weight:600}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ftile{background:var(--panel2);border:2px solid transparent;border-radius:var(--r-s);padding:0;overflow:hidden;position:relative;text-align:center;font-size:12px}
.ftile canvas{display:block;width:100%;aspect-ratio:3/2;background:#000}
.ftile span{display:block;padding:4px 2px}
.ftile[aria-pressed=true]{border-color:var(--violet)}
.ftile .badge{position:absolute;top:4px;right:4px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid var(--edge);padding:0}
.swatch[aria-pressed=true]{border-color:#fff}
.emoji{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.emoji button{background:var(--panel2);border:1px solid var(--edge);border-radius:var(--r-s);font-size:20px;padding:4px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:13.5px}
.field input[type=text],.field input[type=email],.field input[type=password],.field input[type=number],.field select,.field textarea{background:var(--ink);border:1px solid var(--edge);border-radius:var(--r-s);padding:9px 10px;width:100%}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--violet);outline:0}
.field textarea{min-height:90px;resize:vertical}
.err{color:var(--danger);font-size:13px;min-height:18px}
.note{background:var(--panel2);border:1px solid var(--edge);border-radius:var(--r-s);padding:10px 12px;font-size:13px;color:var(--muted)}
.note b{color:var(--text)}
.soonlist{display:flex;flex-direction:column;gap:6px}
.soonlist div{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;padding:7px 10px;background:var(--panel2);border-radius:var(--r-s);opacity:.8}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(8,6,14,.72);display:grid;place-items:center;z-index:50;padding:16px}
.modal .card{background:var(--panel);border:1px solid var(--edge);border-radius:var(--r-l);padding:24px;width:min(440px,100%);max-height:92vh;overflow:auto}
.modal .card.wide{width:min(560px,100%)}
.modal h2{font-size:26px;margin-bottom:6px}
.modal .lede{color:var(--muted);margin-bottom:16px;font-size:14px}
.tabs{display:flex;gap:4px;background:var(--ink);padding:4px;border-radius:99px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:none;padding:7px;border-radius:99px;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--panel2);color:var(--text)}
.busy{position:fixed;inset:0;background:rgba(8,6,14,.6);display:grid;place-items:center;z-index:60}
.busy div{background:var(--panel);border:1px solid var(--edge);padding:18px 24px;border-radius:var(--r-m);text-align:center}
.bar{height:6px;background:var(--ink);border-radius:9px;overflow:hidden;margin-top:10px;width:220px}
.bar i{display:block;height:100%;width:0;background:var(--violet);transition:width .2s}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:70;align-items:center;max-width:92vw}
.toast{background:var(--panel2);border:1px solid var(--edge);padding:9px 16px;border-radius:99px;box-shadow:0 8px 30px rgba(0,0,0,.5);font-size:14px}
.toast.err{border-color:var(--danger)}

/* plans */
.plans{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.plan{background:var(--panel);border:1px solid var(--edge);border-radius:var(--r-l);padding:22px}
.plan.vip{border-color:var(--amber)}
.plan h3{font-size:24px;display:flex;align-items:center;gap:10px}
.plan .price{color:var(--muted);margin:4px 0 14px}
.fl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.fl li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--edge);align-items:flex-start}
.fl li small{display:block;color:var(--muted)}
.cat{margin:14px 0 2px;font:600 15px var(--f-display);color:var(--violet)}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.pcard{background:var(--panel);border:1px solid var(--edge);border-radius:var(--r-m);overflow:hidden}
.pcard img,.pcard .ph{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;background:var(--panel2)}
.pcard .b{padding:10px 12px}
.pcard b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard small{color:var(--muted)}
.empty{border:1px dashed var(--edge);border-radius:var(--r-m);padding:34px;text-align:center;color:var(--muted)}
.gate{max-width:520px;margin:40px auto;text-align:center;padding:30px;background:var(--panel);border:1px solid var(--amber);border-radius:var(--r-l)}
.gate h2{font-size:28px;margin-bottom:8px}
.gate p{color:var(--muted);margin-bottom:16px}
.code{font:600 15px ui-monospace,Menlo,monospace;letter-spacing:.08em;background:var(--ink);padding:3px 8px;border-radius:6px}

/* video / batch / collage layout */
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:0;height:calc(100vh - 53px);min-height:520px}
.split .insp{border-left:1px solid var(--edge)}
.vbar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--edge);background:var(--ink)}
.vbar input[type=range]{flex:1;accent-color:var(--violet)}
.vbar span{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.list .it{display:flex;align-items:center;gap:10px;background:var(--panel2);padding:8px 10px;border-radius:var(--r-s);font-size:13.5px}
.list .it .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .it .st{color:var(--muted)}
.list .it .st.ok{color:var(--mint)}
.list .it .st.bad{color:var(--danger)}
.layouts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.layouts button{background:var(--panel2);border:2px solid transparent;border-radius:var(--r-s);padding:6px;aspect-ratio:1}
.layouts button[aria-pressed=true]{border-color:var(--violet)}
.layouts svg{width:100%;height:100%}
.layouts rect{fill:var(--muted)}

.ed.empty{grid-template-columns:1fr}
.ed.empty .rail,.ed.empty .insp{display:none}
.split.empty{grid-template-columns:minmax(0,1fr) 340px}
@media (max-width:900px){
  .hero{grid-template-columns:1fr;padding-top:26px}
  .ed{grid-template-columns:1fr;grid-template-rows:auto minmax(280px,52vh) auto;height:auto}
  .ed .rail{flex-direction:row;border-right:0;border-top:1px solid var(--edge);order:3;overflow-x:auto}
  .ed .rail button{flex:0 0 66px}
  .ed .stage{order:1}.ed .insp{order:2;border-left:0;border-top:1px solid var(--edge);max-height:none}
  .split{grid-template-columns:1fr;height:auto}
  .plans{grid-template-columns:1fr}
  .top{flex-wrap:wrap;gap:8px}
  .nav{order:3;flex-basis:100%}
  .frame canvas{max-height:46vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* quality preview */
.pvrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.pvbox{margin:0;min-width:0}
.pvbox figcaption{font-size:12px;color:var(--muted);margin-top:4px}
canvas.pv{width:100%;height:auto;border-radius:var(--r-m);background:#0f0d16;touch-action:none;cursor:zoom-in;display:block}
@media(max-width:620px){.pvrow{grid-template-columns:1fr}}

</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/home" aria-label="Lumio home">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#9d8cff"/><circle cx="16" cy="16" r="7" fill="#15121d"/><circle cx="16" cy="16" r="3" fill="#ffc15a"/></svg>
    Lumio
  </a>
  <nav class="nav" id="nav" aria-label="Main">
    <a href="#/home" data-view="home">Home</a>
    <a href="#/photo" data-view="photo">Photo</a>
    <a href="#/video" data-view="video">Video</a>
    <a href="#/collage" data-view="collage">Collage</a>
    <a href="#/batch" data-view="batch">Batch</a>
    <a href="#/formulas" data-view="formulas">Formulas</a>
    <a href="#/projects" data-view="projects">Projects</a>
    <a href="#/plans" data-view="plans">Free and VIP</a>
  </nav>
  <div class="authbox" id="authbox"></div>
</header>

<main id="main">
  <section class="view" id="v-home" hidden></section>
  <section class="view" id="v-photo" hidden></section>
  <section class="view" id="v-video" hidden></section>
  <section class="view" id="v-collage" hidden></section>
  <section class="view" id="v-batch" hidden></section>
  <section class="view" id="v-formulas" hidden></section>
  <section class="view" id="v-projects" hidden></section>
  <section class="view" id="v-plans" hidden></section>
</main>

<div id="modalRoot"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<input type="file" id="pickPhoto" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp" hidden>
<input type="file" id="pickVideo" accept="video/*" hidden>

<script>
/*
 * Lumio feature registry: the single source of truth for what is free, what needs
 * a login (VIP), and what is actually built.
 *
 * tier:   "free"  works for everyone, no account
 *         "vip"   unlocked by signing in (VIP is free with a login)
 * status: "ready"        implemented and working
 *         "optional"     implemented, needs an extra server component (see docs)
 *         "needs-model"  needs a trained AI model; not built yet
 *         "planned"      not built yet
 * wink:   the matching Wink capability, for the parity matrix in docs/WINK_ANALYSIS.md
 */
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.LumioFeatures = factory();
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  var CATEGORIES = [
    { id: "enhance", label: "Enhance", blurb: "Fix noise, softness and color" },
    { id: "retouch", label: "Retouch", blurb: "Portrait and face tools" },
    { id: "color", label: "Color and filters", blurb: "Light, color and looks" },
    { id: "style", label: "Creative styles", blurb: "Turn photos into art" },
    { id: "edit", label: "Edit", blurb: "Crop, text, remove, export" },
    { id: "video", label: "Video", blurb: "Enhance and edit clips" },
    { id: "cloud", label: "Cloud", blurb: "Sync, share and render" }
  ];

  var F = [
    // Enhance
    ["enhance.denoise", "Noise reduction", "enhance", "free", "ready", "both", "Edge-aware denoising that keeps detail.", "Noise reduction"],
